name: Deploy Python Function App to Azure

on:
  push:
    branches:
      - main  # ⚠️ Vérifiez si votre branche principale s'appelle 'main' ou 'master'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: '1. Récupérer le code du dépôt'
      uses: actions/checkout@v4

    - name: '2. Configurer Python 3.10'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: '3. Installer les dépendances Python'
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install -r requirements.txt

    - name: '4. Déployer vers la Function App Azure'
      uses: Azure/functions-action@v1
      with:
        app-name: 'fn-extract-genomx'
        package: '.'
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}