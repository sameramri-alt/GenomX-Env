<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenomX-Env | Assistant IA One Health</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=2">
    <!-- Librairie Marked.js pour le rendu propre du Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- En-tête -->
        <header class="app-header">
            <div class="header-brand">
                <div class="brand-logo">
                    <!-- Nouvelle Icône (ADN / Science) -->
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 22L20 2M4 2L20 22"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                        <circle cx="7" cy="7" r="2"></circle>
                        <circle cx="17" cy="17" r="2"></circle>
                        <circle cx="17" cy="7" r="2"></circle>
                        <circle cx="7" cy="17" r="2"></circle>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>GenomX-Env</h1>
                    <p>Assistant Intelligent One Health & Résistance Antimicrobienne</p>
                </div>
            </div>
            <div class="header-right">
                <button id="themeToggle" class="theme-toggle-btn" title="Changer le thème">
                    <span class="icon-light">☀️</span>
                    <span class="icon-dark" style="display:none;">🌙</span>
                </button>
                <div class="header-status">
                    <span class="status-dot"></span>
                    <span class="status-label">Cosmos DB Connecté</span>
                </div>
            </div>
        </header>

        <!-- Zone des Messages -->
        <main class="chat-container" id="chatContainer">
            <div class="welcome-banner" id="welcomeBanner">
                <div class="welcome-icon">🧬</div>
                <h2>Bienvenue sur l'Assistant GenomX-Env</h2>
            </div>

            <div class="messages-list" id="messagesList">
                <!-- Les messages s'insèrent ici dynamiquement -->
            </div>

            <!-- Indicateur de réflexion (Thinking) masqué par défaut -->
            <div class="thinking-indicator" id="thinkingIndicator">
                <div class="thinking-avatar">
                    <div class="pulse-ring"></div>
                    <span>🧠</span>
                </div>
                <div class="thinking-content">
                    <span class="thinking-text">Analyse des données One Health en cours</span>
                    <div class="dots-animation">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Barre de Saisie Unique -->
        <footer class="app-footer">
            <form class="input-wrapper" id="chatForm">
                <textarea 
                    id="userInput" 
                    placeholder="Posez votre question à l'agent (ex: Analyse la présence du gène fosX chez Listeria en Australie)..." 
                    rows="1" 
                    required
                ></textarea>
                <button type="submit" id="sendBtn" title="Envoyer le message">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
            <div class="footer-hint">Appuyez sur <strong>Entrée</strong> pour envoyer, <strong>Maj + Entrée</strong> pour sauter une ligne</div>
        </footer>
    </div>

    <script src="/static/app.js?v=2"></script>
</body>
</html>
